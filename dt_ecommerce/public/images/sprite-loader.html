<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* You can easily style sprite icons with CSS */
    .icon {
      width: 40px;
      height: 40px;
    }
    .icon-red { color: #ff4757; }
    .icon-gold { color: #ffa502; }
    .icon-green { color: #2ed573; }
    .content-fill { width: 100%; height: 100%;}
  </style>
</head>
<body>

  <!-- Displaying the Heart Icon -->
  <svg class="icon icon-red" aria-hidden="true">
    <use href="/assets/dt_ecommerce/images/socials.svg#facebook"></use>
  </svg>

  <!-- Displaying the Star Icon -->
  <svg class="icon icon-gold" aria-hidden="true">
    <use href="/assets/dt_ecommerce/images/socials.svg#instagram" class="content-fill"></use>
  </svg>
  <!-- Displaying the Star Icon -->
  <svg class="icon icon-green" aria-hidden="true">
    <use href="/assets/dt_ecommerce/images/socials.svg#whatsapp"></use>
  </svg>

</body>
</html>
