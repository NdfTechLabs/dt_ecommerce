{% extends "templates/web.html" %}

{% block title %}{{ _("Product Search") }}{% endblock %}

{% block page_content %}

<div class="dt-search-page">

    <h3 class="dt-search-title">
        {% if q %}
            {{ _("Search results for") }}: "{{ q }}"
        {% else %}
            {{ _("Search Results") }}
        {% endif %}
    </h3>

    <div
        id="search-product-grid"
        class="row item-card-group-section"
    >
    </div>

    <div id="search-no-results" class="text-center hidden">
        <p>{{ _("No results found") }}</p>
    </div>

</div>

<script>
    window.SEARCH_ITEMS = {{ items | tojson }};
    window.WEBSHOP_SETTINGS = {{ webshop_settings | tojson }};
</script>

{% endblock %}
