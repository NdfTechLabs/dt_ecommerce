{% set column_size = 5 if slides else 4 %}
<div class="col-md-{{ column_size }} h-100 d-flex mb-4">
	{% if slides %}
		<div class="item-slideshow d-flex flex-column mr-3">
			{% for item in slides %}
			<img class="item-slideshow-image mb-2 {% if loop.first %}active{% endif %}"
					src="{{ item.image }}" alt="{{ item.heading }}">
			{% endfor %}
		</div>
		{{ product_image(slides[0].image, 'product-image') }}
		<!-- Simple image slideshow -->
		<script>
			frappe.ready(() => {
				$('.page_content').on('click', '.item-slideshow-image', (e) => {
					const $img = $(e.currentTarget);
					const link = $img.prop('src');
					const $product_image = $('.product-image');
					$product_image.find('a').prop('href', link);
					$product_image.find('img').prop('src', link);

					$('.item-slideshow-image').removeClass('active');
					$img.addClass('active');
				});
			})
		</script>
	{% else %}
		{{ product_image(doc.website_image, alt=doc.website_image_alt or doc.item_name) }}
	{% endif %}

	<!-- Simple image preview -->

	<div class="image-zoom-view" style="display: none;">
		<button type="button" class="close" aria-label="Close">
			<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
			stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x">
				<line x1="18" y1="6" x2="6" y2="18"></line>
				<line x1="6" y1="6" x2="18" y2="18"></line>
			</svg>
		</button>
		<div class="product-image-container">
						<div id="image-magnifier"></div>
		</div>
	</div>
</div>
<style>
	.website-image {
		cursor: pointer;
	}

	.image-zoom-view {
		position: fixed;
		top: 0;
		left: 0;
		right: 0;
		bottom: 0;
		height: 100vh;
		width: 100vw;
		display: flex;
		justify-content: center;
		align-items: center;
		background: rgba(0, 0, 0, 0.8);
		z-index: 1080;
	}

	.image-zoom-view img {
		max-height: 100%;
		max-width: 100%;
	}

	.image-zoom-view button {
		position: absolute;
		right: 3rem;
		top: 2rem;
	}

	.image-zoom-view svg {
		color: var(--white);
	}
</style>
<script>
	frappe.ready(() => {
		const $zoom_wrapper = $('.image-zoom-view');

		$('.website-image').on('click', (e) => {
						e.preventDefault();

						const $img = $(e.currentTarget);
						const src = $img.prop('src');

						if (!src) return;

						show_preview(src);
		});

		$zoom_wrapper.on('click', 'button', hide_preview);

		$(document).on('keydown', (e) => {
						if (e.key === 'Escape') {
										hide_preview();
						}
		});


		let zoomLevel = 2;


		function show_preview(src) {
						$zoom_wrapper.show();

						const $img = $(`<img src="${src}">`);

						zoomLevel = 2;

						$img.css({
										transform: "scale(1)"
						});

						$zoom_wrapper.append($img);

						// Enable magnifier
						enableMagnifier($img);

						// Enable mouse-wheel zoom
						$img.on("wheel", function (e) {
										e.preventDefault();

										if (e.originalEvent.deltaY < 0) {
														zoomIn();
										} else {
														zoomOut();
										}
						});
		}


		function zoomIn() {
						zoomLevel = Math.min(zoomLevel + 0.2, 4);

						updateMagnifier();
		}


		function zoomOut() {
						zoomLevel = Math.max(zoomLevel - 0.2, 1);

						updateMagnifier();
		}


		function updateMagnifier() {
						const $img = $zoom_wrapper.find("img");

						if (!$img.length) return;

						// If you want the main preview itself to zoom
						$img.css(
										"transform",
										`scale(${zoomLevel})`
						);
		}


		function enableMagnifier($img) {

						const $magnifier = $("#image-magnifier");

						$img.on("mouseenter", function () {

										$magnifier.show();

										$magnifier.css({
														backgroundImage: `url("${$img.attr("src")}")`
										});
						});


						$img.on("mousemove", function (e) {

										const rect = this.getBoundingClientRect();

										const x = e.clientX - rect.left;
										const y = e.clientY - rect.top;

										const imageWidth = rect.width;
										const imageHeight = rect.height;

										const magnifierSize = 500;
										const gap = 20;

										const viewportWidth = window.innerWidth;
										const viewportHeight = window.innerHeight;

										let left;
										let top;


										// Position magnifier to the right if there is space
										if (
														e.clientX +
														gap +
														magnifierSize <=
														viewportWidth
										) {
														left = e.clientX + gap;
										} else {
														// Otherwise position it to the left
														left =
																		e.clientX -
																		magnifierSize -
																		gap;
										}


										// Vertically center on cursor
										top =
														e.clientY -
														magnifierSize / 2;


										// Keep inside viewport
										if (top < gap) {
														top = gap;
										}

										if (
														top +
														magnifierSize >
														viewportHeight -
														gap
										) {
														top =
																		viewportHeight -
																		magnifierSize -
																		gap;
										}


										$magnifier.css({
														left: `${left}px`,
														top: `${top}px`
										});


										// Magnified image dimensions
										const backgroundWidth =
														imageWidth * zoomLevel;

										const backgroundHeight =
														imageHeight * zoomLevel;


										$magnifier.css({
														backgroundSize:
																		`${backgroundWidth}px ${backgroundHeight}px`
										});


										// Position magnified image
										const bgX = x * zoomLevel;
										const bgY = y * zoomLevel;


										$magnifier.css({
														backgroundPosition: `
																		${magnifierSize / 2 - bgX}px
																		${magnifierSize / 2 - bgY}px
														`
										});

						});


						$img.on("mouseleave", function () {
										$magnifier.hide();
						});
		}

		function hide_preview() {
			$zoom_wrapper.find('img').remove();
			$zoom_wrapper.hide();
		}
	})
</script>
