<section class="dalali-bundles-section" id="dalali-bundles">
	<div class="container">

		<!-- Section Header -->
		<div class="dalali-section-header dalali-bundles-header">
			<h2 class="dalali-section-title dalali-bundles-title">{{ _("Curated Wholesale Bundles") }}</h2>
			<a href="/catalog" class="dalali-section-link dalali-bundles-link">
				{{ _("View all") }}
				<svg width="14" height="14" viewBox="0 0 24 24" fill="none"
					stroke="currentColor" stroke-width="2" stroke-linecap="round"
					stroke-linejoin="round" aria-hidden="true">
					<path d="M5 12h14M12 5l7 7-7 7"/>
				</svg>
			</a>
		</div>

		<!-- Bundle Card Grid -->
		<div class="dalali-bundle-grid">
			{% for bundle in wholesale_bundles %}
    {% include "dt_ecommerce/templates/includes/wholesale_bundles/bundle_card.html"%}
    <!-- /.dalali-bundle-card -->
			{% endfor %}
		</div><!-- /.dalali-bundle-grid -->

	</div><!-- /.container -->
</section>
