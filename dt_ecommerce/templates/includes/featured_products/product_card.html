<div class="dalali-product-card"
				data-item-code="{{ item.item_code | e }}"
				data-case-size="{{ item.case_size }}"
				data-price="{{ item.price }}"
				data-currency="{{ item.currency | e }}">

				<!-- Product Image -->
				<a href="{{ item.url | e }}" class="dalali-product-img-wrap" tabindex="-1" aria-hidden="true">
					{% if item.website_image %}
					<img
						src="{{ item.website_image | e }}"
						alt="{{ item.web_item_name | e }}"
						class="dalali-product-img"
						loading="lazy"
					/>
					{% else %}
					<div class="dalali-product-img-placeholder">🍷</div>
					{% endif %}
				</a>

				<!-- Card Body -->
				<div class="dalali-product-body">
					<span class="dalali-product-category">{{ item.item_group | e }}</span>

					<a href="{{ item.url | e }}" class="dalali-product-name">
						{{ item.web_item_name | e }}
					</a>

					<!-- Pricing block — bottle price server-side, case price filled by JS -->
					<div class="dalali-product-pricing">
						{% if item.price %}
						<div class="dalali-bottle-price">
							{{ item.currency }} {{ "{:,.0f}".format(item.price) }}
							<span class="dalali-price-unit">/ {{ _("btl") }}</span>
						</div>
						<div class="dalali-case-price">
							<!-- JS: case of N price -->
						</div>
						{% else %}
						<div class="dalali-price-na">{{ _("Price on request") }}</div>
						{% endif %}
					</div>

					<!-- Tier badge — filled by JS after bulk tier fetch -->
					<div class="dalali-tier-badge">
						<!-- JS: best discount badge -->
					</div>
				</div><!-- /.dalali-product-body -->

				<!-- CTA Footer -->
				<div class="dalali-product-footer">
					<a href="{{ item.url | e }}" class="dalali-product-cta">
						{{ _("View & Order") }}
					</a>
				</div>

			</div>
