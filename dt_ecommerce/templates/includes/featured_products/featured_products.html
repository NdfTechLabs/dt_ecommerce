<section class="dalali-products-section" id="dalali-products">
	<div class="container">

		<!-- Section Header -->
		<div class="dalali-section-header">
			<h2 class="dalali-section-title">{{ _("Featured Wholesale Products") }}</h2>
			<a href="/catalog" class="dalali-section-link">
				{{ _("View all") }}
				<svg width="14" height="14" viewBox="0 0 24 24" fill="none"
					stroke="currentColor" stroke-width="2" stroke-linecap="round"
					stroke-linejoin="round" aria-hidden="true">
					<path d="M5 12h14M12 5l7 7-7 7"/>
				</svg>
			</a>
		</div>

		<!-- 4-Column Product Card Grid -->
		<div class="dalali-product-grid">
			{% for item in featured_products %}
    {% include "dt_ecommerce/templates/includes/featured_products/product_card.html" %}
			<!-- /.dalali-product-card -->
			{% endfor %}
		</div><!-- /.dalali-product-grid -->

	</div><!-- /.container -->
</section>
