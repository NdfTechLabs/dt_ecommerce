{% if category_grid %}
<section class="dalali-category-section" id="dalali-category-grid">
	<div class="container">

		<!-- Section Header -->
		<div class="dalali-section-header">
			<h2 class="dalali-section-title">{{ _("Shop by Category") }}</h2>
			<a href="/shop-by-category" class="dalali-section-link">
				{{ _("View all") }}
				<svg width="14" height="14" viewBox="0 0 24 24" fill="none"
					stroke="currentColor" stroke-width="2" stroke-linecap="round"
					stroke-linejoin="round" aria-hidden="true">
					<path d="M5 12h14M12 5l7 7-7 7"/>
				</svg>
			</a>
		</div>

		<!-- 4-Column Card Grid -->
		<div class="dalali-category-grid">
			{% for cat in category_grid %}
    {% include "dt_ecommerce/templates/includes/category_grid/category_card.html" %}
			{% endfor %}
		</div>
  <!-- /.dalali-category-grid -->

	</div><!-- /.container -->
</section><!-- /.dalali-category-section -->
{% endif %}
