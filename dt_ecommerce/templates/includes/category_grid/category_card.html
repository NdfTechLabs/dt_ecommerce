			<a href="{{ cat.url | e }}" class="dalali-category-card">

				{% if cat.image_url %}
				<img
					src="{{ cat.image_url | e }}"
					alt="{{ cat.name | e }}"
					class="dalali-category-img"
					loading="lazy"
				/>
				{% else %}
				<div class="dalali-category-img-placeholder" aria-hidden="true">🍷</div>
				{% endif %}

				<span class="dalali-category-name">{{ cat.item_group_name or cat.name }}</span>

			</a>
